name: Supported PHP runtimes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:php-runtime
        env:
          PAGECORE_PHP_EXE: php
      - name: Lint PHP
        run: find cms sample-site -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=line
        env:
          PAGECORE_PHP_EXE: php
