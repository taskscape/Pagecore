name: Supported PHP runtimes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-runtime:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo
          coverage: none
      - name: Resolve PHP executable for test scripts
        shell: powershell
        run: |
          "PAGECORE_PHP_EXE=$((Get-Command php).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:php-runtime
      - run: npm run test:concurrency
      - run: npm run test:mutation-operation
      - run: npm run test:config-schema
      - run: npm run test:modules
      - run: npm run test:api-registry
      - run: npm run test:input-validation
      - run: npm run test:path-policy
      - run: npm run test:front-matter
      - name: Lint PHP
        run: npm run quality:php-lint
      - run: npx playwright install chromium
      - run: npm run test:e2e -- --reporter=line
